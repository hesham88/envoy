<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A chat site</title>
    <!-- A stand-in for a site the user turned Envoy on for. Everyone in it is fictional. -->
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f5f5f7; color: #1f2329; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-bottom: 1px solid #e3e4e8; background: #fff; font-weight: 600; }
      .dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #8a8f98, #5d626b); }
      .wrap { max-width: 760px; margin: 0 auto; padding: 36px 28px; }
      .msg { margin: 0 0 18px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid #e6e7eb; color: #4a4f57; }
      .compose { margin-top: 360px; }
      textarea { width: 100%; height: 120px; box-sizing: border-box; border: 1px solid #d3d5da; border-radius: 16px; padding: 14px 16px; font: 15px/1.55 system-ui, sans-serif; background: #fff; resize: none; }
    </style>
    <script>
      // The extension's chrome.* APIs, stubbed for rendering: rules from storage, no network.
      window.chrome = {
        storage: { local: { get: async () => ({ envoyRules: [{ label: 'PROJECT', terms: ['Project Falcon'] }] }) }, onChanged: { addListener() {} } },
        runtime: { sendMessage: async () => ({ ok: true, findings: [] }) },
      };
    </script>
  </head>
  <body>
    <div class="bar"><span class="dot"></span> Any AI chat</div>
    <div class="wrap">
      <p class="msg">How can I help you today?</p>
      <div class="compose">
        <textarea id="t">Hi, I'm Mona Adel (mona.adel@example.com, +20 100 555 0192). My landlord wants EGP 8,500 by 1 March 2026 for Project Falcon. Can you draft a polite reply?</textarea>
      </div>
    </div>
    <script src="/content.js"></script>
  </body>
</html>
