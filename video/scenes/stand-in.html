<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A chat site</title>
    <!-- Film scene: a stand-in for a site the person turned Envoy on for (no real product's look).
         It runs the REAL extension content script; chrome.* is stubbed (no network). Fictional people. -->
    <style>
      @font-face { font-family: Plex; font-weight: 500; src: url(/fonts-plex/ibm-plex-sans-latin-500-normal.woff2); }
      html, body { margin: 0; height: 100%; background: #121119; color: #e7e5f2; font: 500 17px/1.55 Plex, system-ui, sans-serif; }
      .bar { display: flex; align-items: center; gap: 12px; padding: 16px 30px; border-bottom: 1px solid #262433; font-weight: 600; color: #b9b5d6; }
      .bar i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #6c6889, #3d3a55); }
      .wrap { max-width: 860px; margin: 0 auto; padding: 40px 30px; }
      .msg { margin: 0 0 18px; padding: 16px 18px; border-radius: 16px; background: #1c1b27; border: 1px solid #2b2939; color: #c9c6dd; }
      .compose { margin-top: 300px; position: relative; }
      textarea { width: 100%; height: 130px; box-sizing: border-box; border: 1px solid #34314a; border-radius: 18px; padding: 16px 18px 52px; font: 500 17px/1.55 Plex, system-ui, sans-serif; background: #1a1925; color: #ece9ff; resize: none; outline: none; }
      .tools { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 8px; }
      .tools button { border: 1px solid #34314a; background: #22202f; color: #c9c6dd; border-radius: 999px; padding: 6px 14px; font: 600 14px Plex, system-ui; cursor: pointer; }
    </style>
    <script>
      window.chrome = {
        storage: { local: { get: async () => ({ envoyRules: [] }) }, onChanged: { addListener() {} } },
        runtime: { sendMessage: async () => ({ ok: true, findings: [], ms: 1400 }) },
      };
    </script>
  </head>
  <body>
    <div class="bar"><i></i> Any AI chat</div>
    <div class="wrap">
      <p class="msg">How can I help you today?</p>
      <div class="compose">
        <textarea id="t" aria-label="Message"></textarea>
        <div class="tools">
          <button id="plus" type="button">+ Add files</button>
          <input id="file" type="file" style="display: none" />
        </div>
      </div>
    </div>
    <script>
      document.getElementById('plus').addEventListener('click', () => document.getElementById('file').click());
    </script>
    <script src="/content.js"></script>
  </body>
</html>
