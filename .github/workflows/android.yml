name: Android

# The Android companion: unit tests (including parity with the web engine) and a debug APK.
# No google-services.json in CI, so the APK has no cloud connection; every private step still runs.
on:
  pull_request:
    paths:
      [
        'android/**',
        'packages/core/**',
        'scripts/export-android-fixtures.mjs',
        '.github/workflows/android.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'android/**',
        'packages/core/**',
        'scripts/export-android-fixtures.mjs',
        '.github/workflows/android.yml',
      ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The parity fixtures must match today's TypeScript engine: regenerate and fail if they changed.
      - run: node scripts/export-android-fixtures.mjs && git diff --exit-code android/app/src/test/resources/parity.json android/app/src/main/assets/samples.json
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: envoy-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
