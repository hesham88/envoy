<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Envoy promo</title>
    <style>
      @font-face { font-family: 'Fraunces'; src: url('/fonts/fraunces-latin-opsz-normal.woff2') format('woff2'); font-weight: 100 900; }
      html, body { margin: 0; height: 100%; }
      body { display: grid; place-items: center; overflow: hidden; background: radial-gradient(closest-side at 70% 40%, rgba(123, 92, 255, 0.28), transparent), #0b0a1c; color: #ece9ff; font-family: system-ui, sans-serif; }
      .tile { display: flex; align-items: center; gap: 4%; width: 100%; padding: 0 6%; box-sizing: border-box; }
      .tile img { flex: none; width: 34%; max-width: 360px; -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 70%); mask-image: radial-gradient(circle, #000 62%, transparent 70%); filter: drop-shadow(0 0 24px rgba(61, 255, 176, 0.25)); }
      h1 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.015em; line-height: 0.98; font-size: var(--h, 64px); }
      p { margin: 0.5em 0 0; color: #a9a6cc; font-size: var(--p, 20px); line-height: 1.4; }
      .tags { margin-top: 0.8em; display: flex; flex-wrap: wrap; gap: 8px; font: var(--t, 15px) ui-monospace, Consolas, monospace; }
      .tags span { padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(61, 255, 176, 0.45); background: rgba(61, 255, 176, 0.1); color: #3dffb0; text-shadow: 0 0 8px rgba(61, 255, 176, 0.6); }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="/brand/seal.png" alt="" />
      <div>
        <h1>Ask the cloud. Keep your secrets.</h1>
        <p class="sub">Private details become tags on your device. You approve what leaves.</p>
        <div class="tags"><span>[PERSON]</span><span>[EMAIL]</span><span>[AMOUNT]</span></div>
      </div>
    </div>
  </body>
</html>
